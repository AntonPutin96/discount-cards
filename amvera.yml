# Конфигурация для развертывания React-приложения на Cloud.Amvera.ru

meta:
  environment: static
  toolchain:
    name: npm
    version: '18'

build:
  additionalCommands:
    - npm ci --only=production
    - npm run build

run:
  command: serve -s build
  containerPort: 8080

  # Настройки для статического хостинга
  static:
    directory: build
    index: index.html

  # Оптимизация переменных окружения
  env:
    NODE_ENV: production
    PORT: 8080

  # Ограничения ресурсов
  resources:
    cpu:
      limit: 500m
      request: 250m
    memory:
      limit: 256Mi
      request: 128Mi

  # Безопасность
  security:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  # Мониторинг и логирование
  monitoring:
    metrics:
      enabled: true
      port: 9090

  # Логирование
  logging:
    format: json
    level: info

  # Настройки контейнера
  container:
    image: node:18-alpine
    workingDir: /app

  # Масштабирование
  scaling:
    replicas: 1
    maxReplicas: 3
    minReplicas: 1

  # Обработка зависимостей
  dependencies:
    installCommand: npm ci --only=production
    cacheDir: /app/.npm-cache

  # Дополнительные настройки
  healthCheck:
    path: /
    port: 8080
    interval: 30s
    timeout: 5s
    retries: 3
