meta:
  environment: node
  toolchain:
    name: npm
    version: '18'

build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    '*': /
run:
  scriptName: index.js
  scriptArguments: null
  nodeArguments: null
  command: npm install -g serve && serve -s build
  persistenceMount: /data
  containerPort: '3000'
